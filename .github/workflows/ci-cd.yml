name: CI/CD Pipeline for PromVent

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  # ============================================================
  # CI — Continuous Integration
  # Запускается при каждом push и Pull Request
  # ============================================================
  ci:
    name: CI — Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, mbstring, curl

      - name: Create required directories
        run: mkdir -p leads && chmod 777 leads

      # ----------------------------------------------------------
      # Шаг 1: Линтинг — проверка синтаксиса всех PHP-файлов
      # ----------------------------------------------------------
      - name: Lint — PHP syntax check
        run: |
          echo "Checking PHP syntax..."
          ERRORS=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              php -l "$file"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find . -name "*.php" -not -path "./vendor/*" -print0)

          if [ "$ERRORS" -gt 0 ]; then
            echo "FAILED: $ERRORS file(s) with syntax errors"
            exit 1
          fi
          echo "OK: all PHP files passed syntax check"

      # ----------------------------------------------------------
      # Шаг 2: Unit-тесты
      # ----------------------------------------------------------
      - name: Run unit tests
        run: php tests/run_tests.php

      # ----------------------------------------------------------
      # Шаг 3: Smoke-тест — сайт отвечает 200
      # ----------------------------------------------------------
      - name: Start PHP built-in server
        run: |
          php -S localhost:8080 -t . > /tmp/php-server.log 2>&1 &
          sleep 3

      - name: Smoke test — homepage responds
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)
          echo "Homepage HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "FAILED: expected 200, got $STATUS"
            exit 1
          fi
          echo "OK: homepage is accessible"

      - name: Smoke test — API endpoint responds
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:8080/backend/api.php \
            -d "action=ping")
          echo "API HTTP status: $STATUS"
          # 200 или 400 — оба нормальны, главное не 500
          if [ "$STATUS" = "500" ] || [ "$STATUS" = "000" ]; then
            echo "FAILED: API returned $STATUS"
            exit 1
          fi
          echo "OK: API endpoint is reachable"

      # ----------------------------------------------------------
      # Шаг 4: Проверка критических файлов (структура сборки)
      # ----------------------------------------------------------
      - name: Build check — critical files present
        run: |
          MISSING=0
          for f in index.php index.html admin/leads.php backend/api.php backend/config.php; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "FAILED: $MISSING critical file(s) missing"
            exit 1
          fi
          echo "OK: all critical files present"

      # ----------------------------------------------------------
      # Шаг 5: Сохранение артефакта сборки
      # ----------------------------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: promvent-build-${{ github.sha }}
          path: |
            .
            !.git
            !vendor
          retention-days: 7

  # ============================================================
  # CD — Continuous Deployment
  # Запускается только при push в main и только после успешного CI
  # ============================================================
  cd:
    name: CD — Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: promvent-build-${{ github.sha }}
          path: .

      - name: Prepare deployment
        run: |
          mkdir -p leads
          chmod 777 leads
          echo "Build SHA: ${{ github.sha }}" > build-info.txt
          echo "Deployed at: $(date -u)" >> build-info.txt
          echo "OK: deployment package ready"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          allow_empty_commit: false
          commit_message: "deploy: ${{ github.sha }}"

      - name: Deployment complete
        run: |
          echo "Deployed commit ${{ github.sha }} to GitHub Pages"
          echo "URL: https://yeahbut47.github.io/promvent-site/"
